def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))


def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"


android {
    compileSdkVersion 34

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.rebo2.beituo"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 14
        versionName "14"

        multiDexEnabled true
        
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    sourceSets {
        main {
            specifyManifestFile(manifest, res)
        }
    }

    signingConfigs {
        release{
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}


configurations.all {
    resolutionStrategy {
        force 'androidx.appcompat:appcompat:1.3.1'
        force 'androidx.viewpager2:viewpager2:1.0.0'

    }
}

dependencies {
    
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.10.1'
//    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
//    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'com.anythink.sdk:debugger-ui:1.1.0'
}

def specifyManifestFile(manifest, res) {
    println 'isChina: ' + isChina
    if (isChina == "true") {
        apply from: "build_china.gradle"

        
        manifest.srcFile 'src/main/AndroidManifest-china.xml'
        res.srcDirs += '../../../android/anythink_china/res'
    }
    else if (isChina == "false"){
        apply from: "build_nonchina.gradle"
        manifest.srcFile 'src/main/AndroidManifest-nonchina.xml'
    }
}
